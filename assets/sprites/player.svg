<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple cave explorer character -->
  <!-- Body -->
  <rect x="10" y="14" width="12" height="14" fill="#4a90e2" />
  <!-- Head -->
  <circle cx="16" cy="9" r="6" fill="#ffcc99" />
  <!-- Helmet -->
  <ellipse cx="16" cy="7" rx="7" ry="5" fill="#666666" />
  <!-- Headlamp -->
  <circle cx="16" cy="5" r="2" fill="#ffff00" />
  <circle cx="16" cy="5" r="1" fill="#ffffff" />
  <!-- Arms -->
  <rect x="6" y="16" width="4" height="8" fill="#4a90e2" />
  <rect x="22" y="16" width="4" height="8" fill="#4a90e2" />
  <!-- Legs -->
  <rect x="11" y="28" width="4" height="4" fill="#333333" />
  <rect x="17" y="28" width="4" height="4" fill="#333333" />
</svg>
